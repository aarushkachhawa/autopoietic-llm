[project]
name = "autopoietic-llm"
version = "0.1.0"
description = "Self-evolving LLM agent for open-weight small models: runs tasks, curates its own successful trajectories, and fine-tunes itself via LoRA."
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.19",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
autopoietic = "autopoietic.orchestration.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autopoietic"]

[tool.pytest.ini_options]
markers = [
    "model_required: needs mlx-lm and a downloaded model, not run by default",
]
